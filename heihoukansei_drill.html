<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平方完成トレーニング</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:"Yu Gothic",sans-serif;line-height:1.7}header{padding:20px;background:#2563eb;color:#fff}header h1,header p{margin:0}main{max-width:920px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #d7deea;border-radius:16px;padding:22px;margin-bottom:18px}.hide{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.course{background:#fff;border:2px solid #d7deea;border-radius:12px;padding:17px;text-align:left;font:inherit}.course b{display:block;color:#1747a6}.math{font:clamp(1.4rem,5vw,2rem) "Times New Roman",serif;text-align:center;margin:18px 0}.math sup{font-size:.6em;line-height:0;vertical-align:super}.preview sup{font-size:.52em;line-height:0;position:relative;top:-.72em;vertical-align:baseline;margin-left:.03em}.line{display:block;margin:.28em}.note{padding:12px;background:#eff6ff;border-radius:10px}.meta{display:flex;justify-content:space-between;font-weight:bold;color:#667085}.progress{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}.bar{height:100%;background:#2563eb}.editor{border:2px solid #aab4c3;border-radius:12px;padding:12px}.source{width:100%;border:0;outline:0;padding:8px;font:1.08rem Consolas,monospace}.preview{min-height:70px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border-radius:8px;font:clamp(1.4rem,5vw,2rem) "Times New Roman",serif;overflow:auto}.math-frac{display:inline-grid;grid-template-rows:auto 2px auto;vertical-align:middle;align-items:center;justify-items:center;line-height:1;margin:0 .15em;min-width:1.2em}.math-frac .frac-num,.math-frac .frac-den{display:block;border:0!important;background:transparent!important;border-radius:0!important;padding:.06em .15em!important;font:inherit!important;color:inherit!important;min-width:0!important}.math-frac .frac-bar{width:100%;height:1.7px;background:currentColor}.keys{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.key,.digit-key{border:1px solid #94a3b8;background:#fff;border-radius:8px;padding:9px 12px;font-size:1.05rem;font-weight:bold}.digits{display:grid;grid-template-columns:repeat(5,minmax(44px,68px));gap:7px;margin-top:9px}.digit-key{background:#f8fafc}.help{font-size:.82rem;color:#667085;margin-top:7px}.feedback{padding:12px;border-radius:9px;margin-top:14px;font-weight:bold}.ok{background:#dcfce7;color:#166534}.ng{background:#fee2e2;color:#991b1b}.hint{background:#fef3c7;color:#854d0e}.memo{margin-top:17px;padding:12px;background:#f8fafc;border:1px solid #d7deea;border-radius:10px}.tools,.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.nav{justify-content:space-between}.tool,.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:bold}.tool{border:1px solid #94a3b8;background:#fff}.tool.on{background:#dbeafe;border-color:#2563eb}.paper{height:250px;border:2px solid #aab4c3;border-radius:9px;background-color:#fff;background-image:linear-gradient(#dbeafe 1px,transparent 1px),linear-gradient(90deg,#dbeafe 1px,transparent 1px);background-size:24px 24px;touch-action:none}.paper canvas{width:100%;height:100%;display:block;touch-action:none}.blue{background:#2563eb;color:#fff}.gray{background:#e8edf5}.score{text-align:center;font-size:3rem;color:#2563eb;font-weight:bold}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><header><h1>平方完成トレーニング</h1><p>手書きで考え、答え全体を数式入力しよう</p></header><main>
<section id="home" class="card"><h2>コース選択</h2><div class="grid"><button class="course" onclick="lesson(0)"><b>① 基本解説</b>x²の係数が1</button><button class="course" onclick="start(0)"><b>② 通常コース</b>演習10問</button><button class="course" onclick="lesson(1)"><b>③ 係数あり解説</b>正・負の係数</button><button class="course" onclick="start(1)"><b>④ 係数ありコース</b>演習10問</button></div></section>
<section id="lesson" class="card hide"></section><section id="quiz" class="card hide"><div class="meta"><span id="title"></span><span id="count"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="math"></div><div class="editor"><b>最終解答</b><input id="source" class="source" placeholder="例：(x-3)^2-7" oninput="preview()"><small>数式表示</small><div id="preview" class="preview">ここに数式が表示されます</div><div class="keys"><button class="key" onclick="put('x')">x</button><button class="key" onclick="put('+')">＋</button><button class="key" onclick="put('-')">－</button><button class="key" onclick="put('(')">（</button><button class="key" onclick="put(')')">）</button><button class="key" onclick="put('^2')">□²</button><button class="key" onclick="put('/')">分数線</button><button class="key" onclick="back()">⌫</button><button class="key" onclick="clearAns()">クリア</button></div><div class="digits"><button class="digit-key" onclick="put('1')">1</button><button class="digit-key" onclick="put('2')">2</button><button class="digit-key" onclick="put('3')">3</button><button class="digit-key" onclick="put('4')">4</button><button class="digit-key" onclick="put('5')">5</button><button class="digit-key" onclick="put('6')">6</button><button class="digit-key" onclick="put('7')">7</button><button class="digit-key" onclick="put('8')">8</button><button class="digit-key" onclick="put('9')">9</button><button class="digit-key" onclick="put('0')">0</button></div><div class="help">入力例：2(x+3/2)^2-7/2</div></div><div id="feedback" class="feedback hide"></div><div class="memo"><b>途中式・手書き計算メモ</b><div class="tools"><button id="pen" class="tool on" onclick="setTool('pen')">ペン</button><button id="eraser" class="tool" onclick="setTool('eraser')">消しゴム</button><button class="tool" onclick="undo()">1つ戻す</button><button class="tool" onclick="clearPad()">全部消す</button></div><div class="paper"><canvas id="pad"></canvas></div></div><div class="nav"><button class="btn gray" onclick="show('home')">コース選択へ</button><div><button id="hintBtn" class="btn gray" onclick="hint()">ヒント</button> <button id="checkBtn" class="btn blue" onclick="check()">答え合わせ</button><button id="nextBtn" class="btn blue hide" onclick="next()">次へ</button></div></div></section><section id="result" class="card hide"><h2>結果</h2><div id="score" class="score"></div><div id="msg" class="math"></div><div class="nav"><button class="btn gray" onclick="show('home')">コース選択へ</button><button class="btn blue" onclick="start(mode)">もう一度</button></div></section></main><script>
const $=x=>document.getElementById(x),pick=a=>a[Math.floor(Math.random()*a.length)],ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;let mode=0,qs=[],at=0,score=0;
function show(x){['home','lesson','quiz','result'].forEach(y=>$(y).classList.toggle('hide',x!==y))}function lesson(t){show('lesson');$('lesson').innerHTML=t?`<h2>係数あり</h2><div class="note">最初の2項からx²の係数をくくります。</div><div class="math"><span class="line">2x<sup>2</sup>＋8x＋3</span><span class="line">＝2(x<sup>2</sup>＋4x)＋3</span><span class="line">＝2(x＋2)<sup>2</sup>－5</span></div>`:`<h2>基本</h2><div class="note">xの係数を半分にし、二乗して、増えた分を引きます。</div><div class="math"><span class="line">x<sup>2</sup>＋6x＋2</span><span class="line">＝(x＋3)<sup>2</sup>－7</span></div>`;$('lesson').innerHTML+=`<div class="nav"><button class="btn gray" onclick="show('home')">戻る</button><button class="btn blue" onclick="start(${t})">演習へ</button></div>`}
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);function F(n,d=1){if(d<0){n=-n;d=-d}let g=gcd(Math.abs(n),d)||1;return{n:n/g,d:d/g}}const V=f=>f.n/f.d;function make(pos,t){let a=t?(pos<5?pick([2,3,4]):pick([-3,-2,-1,2,3])):1,odd=t?(pos===6||pos===8):(pos===7||pos===9),h=odd?F(pick([-9,-7,-5,-3,3,5,7,9]),2):F(pick([-6,-5,-4,-3,-2,-1,1,2,3,4,5,6])),b=2*a*V(h),c=(pos===0||pos===4)?0:ri(-12,12),k=F(c*h.d*h.d-a*h.n*h.n,h.d*h.d);return{a,b,c,h,k}}function makeSequence(t){let list=[];for(let pos=0;pos<10;pos++){let q;do{q=make(pos,t)}while(list.slice(-2).some(p=>Math.abs(p.b)===Math.abs(q.b)));list.push(q)}return list}
function si(n,v=''){return n===0?'':(n>0?'＋':'－')+Math.abs(n)+v}function expr(q){return(q.a===1?'':q.a===-1?'－':q.a)+'x<sup>2</sup>'+si(q.b,'x')+si(q.c)}function ft(f){return f.d===1?Math.abs(f.n):Math.abs(f.n)+'/'+f.d}function answer(q){return(q.a===1?'':q.a===-1?'-':q.a)+'(x'+(q.h.n>0?'+':'-')+ft(q.h)+')^2'+(q.k.n===0?'':(q.k.n>0?'+':'-')+ft(q.k))}
function start(t){mode=t;qs=makeSequence(t);at=score=0;show('quiz');render()}function render(){let q=qs[at];$('title').textContent=mode?'係数あり':'通常';$('count').textContent=`${at+1}/10`;$('bar').style.width=(at+1)*10+'%';$('question').innerHTML=expr(q)+' を平方完成しなさい。';$('source').value='';preview();$('feedback').className='feedback hide';$('checkBtn').classList.remove('hide');$('nextBtn').classList.add('hide');requestAnimationFrame(initPad)}
function put(t){let e=$('source'),s=e.selectionStart,n=e.selectionEnd;e.value=e.value.slice(0,s)+t+e.value.slice(n);e.focus();e.setSelectionRange(s+t.length,s+t.length);preview()}function back(){let e=$('source'),s=e.selectionStart,n=e.selectionEnd;if(s!==n)e.value=e.value.slice(0,s)+e.value.slice(n);else if(s){e.value=e.value.slice(0,s-1)+e.value.slice(s);s--}e.focus();e.setSelectionRange(s,s);preview()}function clearAns(){$('source').value='';preview()}function norm(s){return s.replace(/[ 　]/g,'').replace(/[＋]/g,'+').replace(/[－−]/g,'-').replace(/[（]/g,'(').replace(/[）]/g,')').replace(/²/g,'^2').replace(/／/g,'/')}function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function pretty(s){s=norm(s);if(!s)return'ここに数式が表示されます';let safe=esc(s).replace(/\^2/g,'<sup>2</sup>');return safe.replace(/(\d+)\/(\d+)/g,'<span class="math-frac"><span class="frac-num">$1</span><span class="frac-bar"></span><span class="frac-den">$2</span></span>')}function preview(){$('preview').innerHTML=pretty($('source').value)}
function parse(raw){let s=norm(raw),m=s.match(/^([+-]?\d*)\(x([+-])(\d+(?:\/\d+)?)\)\^2(?:([+-])(\d+(?:\/\d+)?))?$/);if(!m)return null;let a=m[1];a=a===''?1:a==='-'?-1:Number(a);let pv=x=>x.includes('/')?Number(x.split('/')[0])/Number(x.split('/')[1]):Number(x);return{a,h:pv(m[3])*(m[2]==='-'?-1:1),k:m[4]?pv(m[5])*(m[4]==='-'?-1:1):0}}const close=(a,b)=>Math.abs(a-b)<1e-9;function check(){let q=qs[at],p=parse($('source').value);if(!p){feed('平方完成の形で入力してください。例：(x-3)^2-7','ng');return}if(close(p.a,q.a)&&close(p.h,V(q.h))&&close(p.k,V(q.k))){score++;feed('正解！<div class="math">'+expr(q)+'<span class="line">＝'+pretty(answer(q))+'</span></div>','ok')}else feed('正解を確認しよう。<div class="math">'+expr(q)+'<span class="line">＝'+pretty(answer(q))+'</span></div>','ng');$('checkBtn').classList.add('hide');$('nextBtn').classList.remove('hide')}function feed(x,c){$('feedback').innerHTML=x;$('feedback').className='feedback '+c}function hint(){feed('xの係数を半分にするところから考えよう。','hint')}function next(){if(++at<10)render();else{show('result');$('score').textContent=score+'/10';$('msg').textContent=score>=8?'よくできました。':'もう一度挑戦しよう。'}}
let cv,cx,down=false,tool='pen',strokes=[],cur;function initPad(){cv=$('pad');let r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx=cv.getContext('2d');cx.setTransform(d,0,0,d,0,0);cx.lineCap=cx.lineJoin='round';strokes=[];draw();if(!cv.dataset.on){cv.addEventListener('pointerdown',pd);cv.addEventListener('pointermove',pm);cv.addEventListener('pointerup',pu);cv.dataset.on=1}}function pt(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function pd(e){e.preventDefault();down=true;cur={tool,pts:[pt(e)]};strokes.push(cur)}function pm(e){if(!down)return;cur.pts.push(pt(e));draw()}function pu(){down=false}function draw(){if(!cx)return;let d=devicePixelRatio||1;cx.clearRect(0,0,cv.width/d,cv.height/d);strokes.forEach(s=>{cx.save();cx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';cx.lineWidth=s.tool==='eraser'?22:2.7;cx.strokeStyle='#172033';cx.beginPath();s.pts.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y));cx.stroke();cx.restore()})}function setTool(t){tool=t;$('pen').classList.toggle('on',t==='pen');$('eraser').classList.toggle('on',t==='eraser')}function undo(){strokes.pop();draw()}function clearPad(){strokes=[];draw()}
</script></body></html>
